services:
  - type: web
    name: bookverse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bookverse-db
          property: connectionString
databases:
  - name: bookverse-db
    plan: free
